
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsctl"
version = "0.1.0"
description = "Infrastructure management CLI"
requires-python = ">=3.11"

[project.scripts]
opsctl = "opscli.cli:main"

[tool.setuptools.packages.find]
include = ["opscli*"]
